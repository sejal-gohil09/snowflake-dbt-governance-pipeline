name: dbt CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  dataops:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Load e-commerce data into Postgres + generate seeds
        run: |
          python scripts/load_data.py --customers 1000 --orders 5000

      - name: 5. Install dbt packages
        working-directory: dbt_project
        run: dbt deps --profiles-dir .

      - name: 6. Load seed data
        working-directory: dbt_project
        run: dbt seed --profiles-dir .
        continue-on-error: true

      - name: 7. Build staging + marts
        working-directory: dbt_project
        run: dbt run --profiles-dir .
        continue-on-error: true

      - name: 8. Run data quality tests
        working-directory: dbt_project
        run: dbt test --profiles-dir .
        continue-on-error: true

      - name: 9. Generate visualizations
        run: python scripts/generate_diagrams.py

      - name: 10. Run pytest data quality tests
        run: pytest tests/ -v --tb=short

      - name: 11. Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: |
            docs/*.png
            dbt_project/target/
          retention-days: 30
